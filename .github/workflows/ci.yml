name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Postgres with pgvector, matching the dev stack, for DB-backed tests.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dpt
          POSTGRES_PASSWORD: dpt
          POSTGRES_DB: dpt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dpt -d dpt_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://dpt:dpt@localhost:5432/dpt_test
      TEST_DATABASE_URL: postgresql+asyncpg://dpt:dpt@localhost:5432/dpt_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest
